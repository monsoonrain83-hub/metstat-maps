name: metstat-maps
on:
  schedule:
    - cron: "35 6 * * *"
    - cron: "35 18 * * *"
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright requests && python -m playwright install --with-deps chromium
      - run: python mx_agent.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes 280
